<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Tool</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    max-width: 960px; margin: 0 auto; padding: 24px 16px 60px;
    color: #222; background: #fafafa;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 8px;
    padding: 18px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #0078d7; }
  select, input[type=text] {
    width: 100%; padding: 7px 9px; border: 1px solid #ccc;
    border-radius: 5px; font-size: 13px; font-family: inherit;
  }
  select[multiple] { height: 180px; font-family: Consolas, monospace; }
  label { font-size: 13px; }
  .row { margin: 10px 0; }
  .hint { color: #999; font-size: 12px; margin-top: 4px; }
  button {
    background: #0078d7; color: #fff; border: none; padding: 9px 22px;
    border-radius: 5px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #0060b0; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  #log {
    background: #1e1e1e; color: #d4d4d4; border-radius: 6px;
    height: 260px; overflow: auto; padding: 12px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  .status { font-size: 12px; margin-left: 10px; }
  .status.running { color: #f0a020; }
  .status.done { color: #2e9e44; }
  .status.failed { color: #d93025; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
</style>
</head>
<body>

<h1>Video Tool</h1>
<div class="sub">视频合并与下载 · 基于 ffmpeg + yt-dlp</div>

<div class="card">
  <h2>视频合并</h2>
  <label>媒体目录中的文件（可 Ctrl / Shift 多选，按列表顺序拼接）：</label>
  <div class="row"><select id="files" multiple></select></div>
  <div class="toolbar">
    <button onclick="refreshFiles()">刷新列表</button>
    <span class="hint" id="fileCount"></span>
  </div>
  <div class="row" style="margin-top:14px">
    <label>输出文件名（相对媒体目录，如 out/result.mkv）：</label>
    <input type="text" id="outname" value="merged.mkv">
  </div>
  <div class="row">
    <label><input type="checkbox" id="reen"> 强制重新编码（不同来源/编码不一致时勾选，速度较慢但可靠）</label>
    <div class="hint">不勾选 = 无损复制（-c copy），速度快；勾选 = 统一转 H.264 + AAC</div>
  </div>
  <button id="btnMerge" onclick="doMerge()">开始合并</button>
</div>

<div class="card">
  <h2>视频下载</h2>
  <div class="row">
    <label>视频地址（m3u8 / 网页链接）：</label>
    <input type="text" id="url" placeholder="https://... 或 m3u8 地址">
  </div>
  <div class="row">
    <label>保存到子目录（留空则存到媒体根目录）：</label>
    <input type="text" id="subdir" placeholder="例如 downloads">
  </div>
  <button id="btnDownload" onclick="doDownload()">开始下载</button>
  <div class="hint">yt-dlp 会自动识别 m3u8 分片，并调用 ffmpeg 合并为单个视频文件。</div>
</div>

<div class="card">
  <h2>运行日志 <span id="status" class="status"></span></h2>
  <div id="log">等待任务…</div>
</div>

<script>
let timer = null;

function statusText(s) {
  return { running: "运行中", done: "已完成", failed: "失败" }[s] || s;
}

function setRunning(running) {
  document.getElementById("btnMerge").disabled = running;
  document.getElementById("btnDownload").disabled = running;
}

function refreshFiles() {
  fetch("/api/files").then(r => r.json()).then(list => {
    const sel = document.getElementById("files");
    const prev = new Set([...sel.options].filter(o => o.selected).map(o => o.value));
    sel.innerHTML = "";
    list.forEach(f => {
      const o = document.createElement("option");
      o.value = f.path;
      o.textContent = f.path + "   (" + (f.size / 1048576).toFixed(1) + " MB)";
      if (prev.has(f.path)) o.selected = true;
      sel.appendChild(o);
    });
    document.getElementById("fileCount").textContent = "共 " + list.length + " 个视频文件";
  });
}

function poll(tid) {
  const box = document.getElementById("log");
  const st = document.getElementById("status");
  setRunning(true);
  st.className = "status running";
  st.textContent = "运行中";

  timer = setInterval(() => {
    fetch("/api/log/" + tid).then(r => r.json()).then(d => {
      box.textContent = d.log.join("\n");
      box.scrollTop = box.scrollHeight;
      st.className = "status " + d.status;
      st.textContent = statusText(d.status);
      if (d.status !== "running") {
        clearInterval(timer);
        timer = null;
        setRunning(false);
        refreshFiles();
      }
    }).catch(() => {});
  }, 1000);
}

function doMerge() {
  const sel = document.getElementById("files");
  const files = [...sel.selectedOptions].map(o => o.value);
  if (files.length < 2) { alert("请至少选择 2 个文件"); return; }
  fetch("/api/merge", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      files: files,
      output: document.getElementById("outname").value.trim(),
      reencode: document.getElementById("reen").checked
    })
  }).then(r => r.json()).then(d => {
    if (d.error) { alert(d.error); return; }
    poll(d.task);
  });
}

function doDownload() {
  const url = document.getElementById("url").value.trim();
  if (!url) { alert("请输入视频地址"); return; }
  fetch("/api/download", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      url: url,
      subdir: document.getElementById("subdir").value.trim()
    })
  }).then(r => r.json()).then(d => {
    if (d.error) { alert(d.error); return; }
    poll(d.task);
  });
}

refreshFiles();
</script>
</body>
</html>
