name: 问题反馈
description: 报告 bug 或异常行为
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [常见问题](https://github.com/qianliaa/video-tool/blob/main/docs/faq.md)，并确认已更新到最新版本。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页「关于与更新」里显示的版本号，或 Docker 镜像 tag
      placeholder: 1.7.5
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 飞牛 fnOS（fpk）
        - Docker
        - 源码直接运行
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 系统与架构
      placeholder: 飞牛 fnOS 0.9.x / x86_64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「合并」
        2. 选择 3 个文件...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 任务日志
      description: 任务页里的实时日志（注意去掉本地路径等隐私信息）
      render: text
  - type: textarea
    id: ffmpeg
    attributes:
      label: ffmpeg 版本
      description: 输出 `ffmpeg -version` 的第一行；Docker 部署可填「镜像内置」
      render: text
