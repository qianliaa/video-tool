name: Build FPK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build fpk
        run: python pack.py

      - name: Show output
        run: ls -lh video-tool.fpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videotool-fpk
          path: video-tool.fpk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: video-tool.fpk
