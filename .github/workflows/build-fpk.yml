name: Build FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack.tar.gz \
            https://static2.fnnas.com/fnpack/fnpack-1.0.3-linux-amd64.tar.gz
          tar -xzf fnpack.tar.gz
          chmod +x fnpack
          ./fnpack --version

      - name: Build fpk
        run: |
          cd fnos
          ../fnpack build

      - name: Find output
        id: find
        run: |
          FPK=$(find fnos -name "*.fpk" | head -n 1)
          echo "path=$FPK" >> $GITHUB_OUTPUT
          ls -lh "$FPK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videotool-fpk
          path: ${{ steps.find.outputs.path }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}
