name: Build FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          set -e
          URLS=(
            "https://static2.fnnas.com/fnpack/fnpack-linux-amd64.tar.gz"
            "https://static2.fnnas.com/fnpack/fnpack-1.2.0-linux-amd64.tar.gz"
            "https://static2.fnnas.com/fnpack/fnpack-1.0.3-linux-amd64.tar.gz"
          )
          OK=0
          for u in "${URLS[@]}"; do
            echo "try: $u"
            if curl -fsSL --retry 2 --connect-timeout 10 -o fnpack.tar.gz "$u"; then
              echo "download ok: $u"
              OK=1
              break
            else
              echo "download fail: $u"
            fi
          done
          if [ "$OK" -eq 0 ]; then
            echo "all urls failed, check https://developer.fnnas.com/docs/cli/fnpack"
            exit 1
          fi
          tar -xzf fnpack.tar.gz
          chmod +x fnpack
          ./fnpack --version || true

      - name: Build fpk
        run: |
          cd fnos
          ../fnpack build

      - name: Find output
        id: find
        run: |
          FPK=$(find fnos -name "*.fpk" | head -n 1)
          echo "path=$FPK" >> $GITHUB_OUTPUT
          ls -lh "$FPK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videotool-fpk
          path: ${{ steps.find.outputs.path }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}
